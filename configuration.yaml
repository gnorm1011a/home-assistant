homeassistant:
  customize: !include customize.yaml
  allowlist_external_dirs:
  - /config/www/snapshots

# Enables the frontend
http:
  ssl_certificate: /ssl/fullchain.pem
  ssl_key: /ssl/privkey.pem
  cors_allowed_origins:
    - https://google.com
    - https://www.home-assistant.io
    - https://keitetran.github.io/BroadlinkIRTools/dist/#/
  ip_ban_enabled: false
  login_attempts_threshold: 5

system_health:

default_config:

# Allows you to issue voice commands from the frontend in enabled browsers
conversation:

# Enables support for tracking state changes over time
history:

# Tracked history is kept for 10 days
recorder:
  purge_keep_days: 10

# View all events in a logbook
logbook:
  include:
    entities:
      - device_tracker.google_maps_105998041168534774687

# Track the sun
sun:

my:

energy:

scene: !include scenes.yaml

logger:
  default: info

# Text to speech
# tts: configured via UI

# Broadlink IR - Fan only (bedroom)
# Other Broadlink devices removed during cleanup:
#   34:EA:34:8E:F8:53 (Living Room - AC/Heat/TV)
#   A0:43:B0:07:E9:E0 (Den - AC/Heat/Stereo)
#   24:DF:A7:DF:09:EE (Guestroom - AC/Heat)
switch:
  - platform: broadlink
    mac: '34:EA:34:58:9E:0A'
    switches:
      - name: Fan
        command_on: 'JgCcACoNKg0PKSoNKA8NKg8pDygOKQ8oKw0MAAEIKg0oDw0qKw0oDw0qDygPKQ4pDikqDQ0AAQcrDSoNDygqDSsNDikOKQ8oDygNKyoNDwABBSgPKw0PKCgPKwwPKA0rDCsNKg0qKQ8PAAEFKg0rDA8oKw0qDQ8oDygPKQ4pDygqDQ4AAQYrDSgPDSoqDSsNDikOKQ8oDykOKSoNDgANBQAAAAAAAAAAAAAAAA=='
        command_off: ''

template: !include template.yaml


sensor:
  - platform: history_stats
    name: Mew Meow Avg Time Outside
    entity_id: binary_sensor.mew_meow
    state: 'off'
    type: time
    end: '{{ now() }}'
    duration:
      days: 7

  - platform: history_stats
    name: Mew Meow Duration Inside
    entity_id: binary_sensor.mew_meow
    state: 'on'
    type: time
    start: '{{ now().replace(hour=0, minute=0, second=0) }}'
    end: '{{ now() }}'

  - platform: history_stats
    name: Mew Meow Duration Outside
    entity_id: binary_sensor.mew_meow
    state: 'off'
    type: time
    start: '{{ now().replace(hour=0, minute=0, second=0) }}'
    end: '{{ now() }}'

  - platform: history_stats
    name: Mew Meow Time Outside Day 1
    entity_id: binary_sensor.mew_meow
    state: 'off'
    type: time
    start: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=1) }}'
    end: '{{ now().replace(hour=0, minute=0, second=0) }}'

  - platform: history_stats
    name: Mew Meow Time Outside Day 2
    entity_id: binary_sensor.mew_meow
    state: 'off'
    type: time
    start: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=2) }}'
    end: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=1) }}'

  - platform: history_stats
    name: Mew Meow Time Outside Day 3
    entity_id: binary_sensor.mew_meow
    state: 'off'
    type: time
    start: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=3) }}'
    end: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=2) }}'

  - platform: history_stats
    name: Mew Meow Time Outside Day 4
    entity_id: binary_sensor.mew_meow
    state: 'off'
    type: time
    start: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=4) }}'
    end: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=3) }}'

  - platform: history_stats
    name: Mew Meow Time Outside Day 5
    entity_id: binary_sensor.mew_meow
    state: 'off'
    type: time
    start: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=5) }}'
    end: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=4) }}'

  - platform: history_stats
    name: Mew Meow Time Outside Day 6
    entity_id: binary_sensor.mew_meow
    state: 'off'
    type: time
    start: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=6) }}'
    end: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=5) }}'

  - platform: history_stats
    name: Mew Meow Time Outside Day 7
    entity_id: binary_sensor.mew_meow
    state: 'off'
    type: time
    start: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=7) }}'
    end: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=6) }}'

  - platform: history_stats
    name: Washing Machine Cycles Daily
    entity_id: sensor.electrolux_washing_machine_totalcyclecounter
    state: 'on'
    type: count
    start: '{{ now().replace(hour=0, minute=0, second=0) }}'
    end: '{{ now() }}'

  - platform: history_stats
    name: Washing Machine Cycles Weekly
    entity_id: sensor.electrolux_washing_machine_totalcyclecounter
    state: 'on'
    type: count
    start: '{{ now().replace(hour=0, minute=0, second=0) - timedelta(days=now().weekday()) }}'
    end: '{{ now() }}'

  - platform: history_stats
    name: Washing Machine Cycles Monthly
    entity_id: sensor.electrolux_washing_machine_totalcyclecounter
    state: 'on'
    type: count
    start: '{{ now().replace(day=1, hour=0, minute=0, second=0) }}'
    end: '{{ now() }}'

  - platform: history_stats
    name: Washing Machine Cycles Yearly
    entity_id: sensor.electrolux_washing_machine_totalcyclecounter
    state: 'on'
    type: count
    start: '{{ now().replace(month=1, day=1, hour=0, minute=0, second=0) }}'
    end: '{{ now() }}'

#Motion statistics
  - platform: history_stats
    name: "Daily Person Count"
    entity_id: binary_sensor.front_balcony_person
    state: 'on'
    type: count
    start: '{{ now().replace(hour=0, minute=0, second=0) }}'
    end: '{{ now() }}'

  - platform: history_stats
    name: "Daily Vehicle Count"
    entity_id: binary_sensor.front_balcony_vehicle
    state: 'on'
    type: count
    start: '{{ now().replace(hour=0, minute=0, second=0) }}'
    end: '{{ now() }}'

  - platform: history_stats
    name: "Daily Pet Count"
    entity_id: binary_sensor.front_balcony_pet
    state: 'on'
    type: count
    start: '{{ now().replace(hour=0, minute=0, second=0) }}'
    end: '{{ now() }}'


input_number:
  spotify_volume:
    name: Volume
    icon: mdi:volume-high
    min: 0
    max: 1
    step: 0.05

input_select:

  house_mode:
    name: "House Mode"
    options:
      - "None"
      - "Home"
      - "Away"
      - "Sleep"
      - "Holiday"
    initial: "None"

  bedroom_light_scenes:
    name: Bedroom Scenes
    options:
      - "Select"
      - "Energize"
      - "Read"
      - "Relax"
      - "Concentrate"
      - "Savanna sunset"
      - "Arctic aurora"
      - "Tropical twilight"
      - "Spring blossom"

### Template Sensors ###
- sensor:
    - name: General waste days
      state: >-
        {% set midnight = today_at() %}
        {% set event = state_attr('calendar.general_waste', 'start_time') | as_datetime | as_local %}
        {% set delta = event - midnight %}
        {% if delta.days == 0 %}
            Today
        {% elif delta.days == 1 %}
            Tomorrow
        {% else %}
            In {{ delta.days }} Days
        {% endif %} 

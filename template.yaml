### Cat sensors ###
- sensor:
    - name: "Mewy Location Info"
      state: >
        {% if is_state('binary_sensor.mew_meow', 'on') %}
          Home (Inside for {{ relative_time(states.binary_sensor.mew_meow.last_changed) }})
        {% else %}
          Away (Outside for {{ relative_time(states.binary_sensor.mew_meow.last_changed) }})
        {% endif %}

- sensor:
    - name: "Mew Meow Entries"
      state: "{{ states('sensor.surepetcare_flap_stats') }}"
      attributes:
        last_entry: "{{ state_attr('sensor.surepetcare_flap_stats', 'last_entry') }}"
        exits: "{{ state_attr('sensor.surepetcare_flap_stats', 'exits') }}"
        looked_through: "{{ state_attr('sensor.surepetcare_flap_stats', 'looked_through') }}"

- sensor:
    - name: "Avg Outside Formatted"
      state: >
        {% set hours = states('sensor.mew_meow_avg_time_outside') | float(0) / 7 %}
        {% set minutes = (hours % 1) * 60 %}
        {{ hours | int }}h {{ minutes | int }}m
- sensor:
    - name: "Duration Outside Formatted"
      state: >
        {% set hours = states('sensor.mew_meow_duration_outside') | float(0) %}
        {% set minutes = (hours % 1) * 60 %}
        {{ hours | int }}h {{ minutes | int }}m

- sensor:
    - name: "Duration Inside Formatted"
      state: >
        {% set hours = states('sensor.mew_meow_duration_inside') | float(0) %}
        {% set minutes = (hours % 1) * 60 %}
        {{ hours | int }}h {{ minutes | int }}m

- sensor:
    - name: "Alarm Sequence Last Triggered"
      state: >
        {% set last_triggered = state_attr('script.cds_alarm_sequence', 'last_triggered') %}
        {% if last_triggered %}
          {{ as_timestamp(last_triggered) | timestamp_custom('%Y-%m-%d %H:%M:%S') }}
        {% else %}
          Never
        {% endif %}

### Washing machine sensors ###
- sensor:
    - name: "washing_machine_time_remaining"
      state: >
        {% set time_left = states('sensor.electrolux_washing_machine_timetoend') | int %}
        {% set hours = (time_left // 60) %}
        {% set minutes = (time_left % 60) %}
        {% if hours > 0 %}
          {{ hours }} hour{{ 's' if hours > 1 else '' }} {{ minutes }} minute{{ 's' if minutes > 1 else '' }} remaining
        {% else %}
          {{ minutes }} minute{{ 's' if minutes > 1 else '' }} remaining
        {% endif %}
- sensor:
    - name: "washing_machine_total_working_time_hours"
      state: >
        {% set total_minutes = states('sensor.electrolux_washing_machine_appliancetotalworkingtime') | int %}
        {% set total_hours = total_minutes / 60 %}
        {{ '%.2f' | format(total_hours) }} hours
- sensor:
    - name: "washing_machine_cycles_average_yearly"
      state: >
        {% set total_cycles = states('sensor.electrolux_washing_machine_totalcyclecounter') | int %}
        {% set years = (now().year - 2024) + 1 %}
        {{ (total_cycles / years) | round(2) }}
      unit_of_measurement: "cycles/year"
- sensor:
    - name: "washing_machine_cycles_average_monthly"
      state: >
        {% set total_cycles = states('sensor.electrolux_washing_machine_totalcyclecounter') | int %}
        {% set months = ((now().year - 2024) * 12) + now().month %}
        {{ (total_cycles / months) | round(2) }}
      unit_of_measurement: "cycles/month"
- sensor:
    - name: "washing_machine_cycles_average_weekly"
      state: >
        {% set total_cycles = states('sensor.electrolux_washing_machine_totalcyclecounter') | int %}
        {% set weeks = ((now().year - 2024) * 52) + now().isocalendar()[1] %}
        {{ (total_cycles / weeks) | round(2) }}
      unit_of_measurement: "cycles/week"

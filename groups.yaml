## Main Groups
default_view:
  name: Home
  icon: mdi:home-outline
  view: yes
  entities:
  - group.house_mode
  - group.lights_overview
  - group.climate_overview
  - group.weather_overview
  - group.tv_overview
  - group.motion
  - group.music
  - group.music_spotify
  - group.tv_test
  - group.weather
  - group.camera

controls:
  name: Video
  icon: mdi:television-classic
  view: yes
  entities:
  - group.tv_channels
  - media_player.living_room_tv
  - group.tv_remote
  - script.tv_netflix
  
climate:
  name: Climate
  icon: mdi:snowflake
  view: yes
  entities:
  - group.current_weather
  - group.living_room_ac_controls
  - group.bedroom_ac_controls
  - group.fan
  
lights:
  name: Lighting
  view: yes
  icon: mdi:lightbulb-outline
  entities:
  - group.bedroom_lights
  - group.living_room_lights
  - group.lights_overview_kitchen
  - group.lighting_scenes

media:
  name: Media
  view: yes
  icon: mdi:music
  entities:
  - media_player.living_room_tv
  - media_player.whole_house
  - media_player.sony  
  - media_player.spotify 
  - media_player.bedroom_speaker_2
  - media_player.downstairs
  - media_player.kitchen_speaker_3
  - media_player.living_room_speaker
  - group.stereo
  
settings:
  name: Settings
  view: yes
  icon: mdi:cog
  entities:
  - group.scripts
  - group.notifications
  

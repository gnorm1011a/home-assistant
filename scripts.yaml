set_hue_scene:
  alias: Set Hue Scene
  description: Activate a Hue scene for a given group and scene name
  mode: single
  fields:
    group:
      description: Group name (Bedroom, Upstairs, Garden)
      example: Bedroom
      required: true
      selector:
        select:
          options:
            - Bedroom
            - Upstairs
            - Garden
    scene:
      description: Scene name
      example: Energize
      required: true
      selector:
        text: {}
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ group == ''Upstairs'' and scene == ''Crocus'' }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.upstairs_crocus
    default:
    - action: scene.turn_on
      target:
        entity_id: >-
          {% set group_map = {'Bedroom': 'bedroom', 'Upstairs': 'living_room', 'Garden': 'garden'} %}
          {% set scene_slug = scene | lower | replace(' ', '_') %}
          scene.{{ group_map[group] }}_{{ scene_slug }}

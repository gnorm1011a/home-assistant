      entity_id: input_boolean.laundry_removed
  description: Helper to dismiss the persistent laundry notification.
  icon: hue:room-laundry
zha_add_device:
  sequence:
  - action: zha.permit
    data:
      duration: 60
  alias: ZHA - Add Device
  description: ''
cast_media_with_no_chime:
  alias: "Cast Media with no Chime \U0001F515"
  sequence:
  - condition: state
    entity_id: input_boolean.speaker_alerts
    state: 'on'
  - variables:
      orig_vol: '{{ state_attr(media_file.entity_id, ''volume_level'') | float(0.5) }}'
      orig_muted: '{{ is_state_attr(media_file.entity_id, ''is_volume_muted'', true) }}'
      orig_state: '{{ states(media_file.entity_id) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_state(media_file.entity_id, ''idle'') and state_attr(media_file.entity_id,
          ''app_name'') == ''Default Media Receiver'' }}'
      sequence:
      - target:
          entity_id: '{{ media_file.entity_id }}'
        data:
          media_content_id: https://parkplace.duckdns.org:8123/local/silence.wav
          media_content_type: music
        action: media_player.play_media
      - wait_template: '{{ is_state(media_file.entity_id, ''playing'') }}'
        timeout: '0:00:05'
        continue_on_timeout: true
      - delay:
          milliseconds: 400
      - target:
          entity_id: '{{ media_file.entity_id }}'
        data:
          volume_level: '{{ volume }}'
        action: media_player.volume_set
      - delay:
          milliseconds: 300
    default:
    - target:
        entity_id: '{{ media_file.entity_id }}'
      data:
        is_volume_muted: true
      action: media_player.volume_mute
    - delay: 00:00:01
    - target:
        entity_id: '{{ media_file.entity_id }}'
      data:
        media_content_id: https://parkplace.duckdns.org:8123/local/silence.wav
        media_content_type: music
      action: media_player.play_media
    - wait_template: '{{ is_state(media_file.entity_id, ''playing'') }}'
      timeout: '0:00:08'
      continue_on_timeout: true
    - target:
        entity_id: '{{ media_file.entity_id }}'
      data:
        volume_level: '{{ volume }}'
      action: media_player.volume_set
    - delay: 00:00:01
    - target:
        entity_id: '{{ media_file.entity_id }}'
      data:
        is_volume_muted: false
      action: media_player.volume_mute
    - delay:
        milliseconds: 500
  - target:
      entity_id: '{{ media_file.entity_id }}'
    data:
      media_content_id: '{{ media_file.media_content_id }}'
      media_content_type: '{{ media_file.media_content_type }}'
    action: media_player.play_media
    continue_on_error: true
  - wait_template: '{{ is_state(media_file.entity_id, ''playing'') }}'
    timeout: '0:00:10'
    continue_on_timeout: true
  - wait_template: '{{ not is_state(media_file.entity_id, ''playing'') }}'
    timeout: '0:01:00'
    continue_on_timeout: true
  - target:
      entity_id: '{{ media_file.entity_id }}'
    data:
      media_content_id: https://parkplace.duckdns.org:8123/local/silence.wav
      media_content_type: music
    action: media_player.play_media
    continue_on_error: true
  - wait_template: '{{ is_state(media_file.entity_id, ''playing'') }}'
    timeout: '0:00:05'
    continue_on_timeout: true
  - delay:
      milliseconds: 400
  - target:
      entity_id: '{{ media_file.entity_id }}'
    data:
      volume_level: '{{ orig_vol }}'
    action: media_player.volume_set
    continue_on_error: true
  - delay:
      milliseconds: 300
  - target:
      entity_id: '{{ media_file.entity_id }}'
    data:
      is_volume_muted: '{{ orig_muted }}'
    action: media_player.volume_mute
    continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ orig_state == ''off'' }}'
    then:
    - target:
        entity_id: '{{ media_file.entity_id }}'
      action: media_player.turn_off
      continue_on_error: true
  mode: parallel
  fields:
    media_file:
      selector:
        media: {}
      name: Media File
      required: true
    volume:
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
      name: Volume
      default: 0.5
      required: true
  description: ''
guest_lamp_apply_scene:
  alias: Guest Lamp - Apply Scene
  description: Turns on light.guestroom using the scene selected in input_select.guest_lamp_scene.
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.guest_lamp_scene
        state: "Relax"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.guestroom
        data:
          color_temp_kelvin: 2237
          brightness_pct: 56
          transition: 1
    - conditions:
      - condition: state
        entity_id: input_select.guest_lamp_scene
        state: "Energise"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.guestroom
        data:
          color_temp_kelvin: 6410
          brightness_pct: 100
          transition: 1
    - conditions:
      - condition: state
        entity_id: input_select.guest_lamp_scene
        state: "Nightlight"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.guestroom
        data:
          color_temp_kelvin: 2000
          brightness_pct: 3
          transition: 1
    - conditions:
      - condition: state
        entity_id: input_select.guest_lamp_scene
        state: "Purple"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.guestroom
        data:
          hs_color:
          - 275
          - 85
          brightness_pct: 70
          transition: 1
    default:
    - action: light.turn_on
      target:
        entity_id: light.guestroom
      data:
        color_temp_kelvin: 2890
        brightness_pct: 100
        transition: 1
  mode: single

ensure_off:
  alias: Ensure Off
  description: Turn entity off with retry - covers dropped Zigbee commands.
  mode: parallel
  sequence:
  - action: homeassistant.turn_off
    target:
      entity_id: '{{ entity }}'
  - delay: '00:00:05'
  - if:
    - condition: template
      value_template: "{{ not is_state(entity, 'off') }}"
    then:
    - action: homeassistant.turn_off
      target:
        entity_id: '{{ entity }}'
    - delay: '00:00:05'
  - if:
    - condition: template
      value_template: "{{ not is_state(entity, 'off') }}"
    then:
    - action: homeassistant.turn_off
      target:
        entity_id: '{{ entity }}'
    - delay: '00:00:05'
  - if:
    - condition: template
      value_template: "{{ not is_state(entity, 'off') }}"
    then:
    - action: homeassistant.turn_off
      target:
        entity_id: '{{ entity }}'

alarm_cancel:
  alias: Alarm Cancel
  description: >-
    Voice alarm cancel, exposed to Google ('ok google, turn off the alarm' via
    switch.alarm, or 'ok google, turn on alarm cancel' as a scene). Only valid
    while Alarmo is pending: first call opens a 30-second confirm window and
    asks for confirmation; a second call within the window disarms. A
    triggered or fully armed alarm can never be voice-cancelled.
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.alarm_cancel_confirm
        state: 'on'
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: pending
      sequence:
      - action: alarm_control_panel.alarm_disarm
        target:
          entity_id: alarm_control_panel.alarmo
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.alarm_cancel_confirm
      - action: timer.cancel
        target:
          entity_id: timer.alarm_cancel_confirm_window
      - action: tts.speak
        target:
          entity_id: tts.home_assistant_cloud
        data:
          media_player_entity_id: media_player.kitchen_display
          message: Alarm disarmed.
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: pending
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.alarm_cancel_confirm
      - action: timer.start
        target:
          entity_id: timer.alarm_cancel_confirm_window
      - action: tts.speak
        target:
          entity_id: tts.home_assistant_cloud
        data:
          media_player_entity_id: media_player.kitchen_display
          message: Are you sure? Say 'turn off the alarm' again within thirty seconds to disarm.
    default:
    - action: tts.speak
      target:
        entity_id: tts.home_assistant_cloud
      data:
        media_player_entity_id: media_player.kitchen_display
        message: No alarm is pending.
  - action: media_player.turn_off
    target:
      entity_id: media_player.kitchen_display
    continue_on_error: true

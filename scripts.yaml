  icon: hue:room-laundry
zha_add_device:
  sequence:
  - action: zha.permit
    data:
      duration: 60
  alias: ZHA - Add Device
  description: ''
cast_media_with_no_chime:
  alias: "Cast Media with no Chime \U0001F515"
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_state(media_file.entity_id,''off'') }}'
      sequence:
      - target:
          entity_id: '{{ media_file.entity_id }}'
        data:
          volume_level: 0
        action: media_player.volume_set
      - target:
          entity_id: '{{ media_file.entity_id }}'
        data: {}
        action: media_player.turn_on
      - if:
        - condition: template
          value_template: '{{ not is_state(media_file.entity_id, ''idle'') }}'
        then:
        - wait_template: '{{ is_state(media_file.entity_id, ''idle'') }}'
          timeout: 0:00:05
    - conditions:
      - condition: template
        value_template: '{{ is_state(media_file.entity_id, ''idle'') }}'
      sequence: []
  - target:
      entity_id: '{{ media_file.entity_id }}'
    data:
      volume_level: '{{ volume }}'
    action: media_player.volume_set
  - target:
      entity_id: '{{ media_file.entity_id }}'
    data:
      media_content_id: '{{ media_file.media_content_id }}'
      media_content_type: '{{ media_file.media_content_type }}'
    action: media_player.play_media
  mode: single
  fields:
    media_file:
      selector:
        media: {}
      name: Media File
      required: true
    volume:
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
      name: Volume
      default: 0.5
      required: true
  description: ''
